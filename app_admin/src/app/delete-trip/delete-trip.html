<div class="col-md-6">
  <h2>Delete Trip</h2>

  <div *ngIf="trip">
    <p>
      Are you sure you want to delete
      <strong>{{ trip.name }}</strong>?
    </p>

    <button
      class="btn btn-danger"
      (click)="confirmDelete()">
      Confirm Delete
    </button>

    <button
      class="btn btn-secondary"
      (click)="cancel()">
      Cancel
    </button>
  </div>
</div>
